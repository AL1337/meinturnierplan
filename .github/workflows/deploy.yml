name: Deploy to WordPress.org

# Pushing a version tag (e.g. 1.3.0 or v1.3.0) deploys that commit to the
# WordPress.org SVN repository. Run the workflow manually for a dry run that
# builds the release without committing anything.
#
# Required repository secrets: SVN_USERNAME and SVN_PASSWORD (the wordpress.org
# account that owns the plugin).

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: build the release but do not commit to SVN'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the plugin version
        id: version
        run: |
          set -euo pipefail
          HEADER=$(sed -n 's/^ \* Version: *//p' meinturnierplan.php | tr -d '\r[:space:]')
          CONST=$(sed -n "s/.*MTRN_PLUGIN_VERSION', *'\([^']*\)'.*/\1/p" meinturnierplan.php)
          STABLE=$(sed -n 's/^Stable tag: *//p' readme.txt | tr -d '\r[:space:]')
          echo "header=$HEADER const=$CONST stable=$STABLE"
          if [ "$HEADER" != "$CONST" ] || [ "$HEADER" != "$STABLE" ]; then
            echo "::error::Version mismatch between the plugin header ($HEADER), MTRN_PLUGIN_VERSION ($CONST) and readme.txt Stable tag ($STABLE)"
            exit 1
          fi
          echo "version=$HEADER" >> "$GITHUB_OUTPUT"

      - name: Check that the tag matches the plugin version
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match plugin version ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Deploy to WordPress.org SVN
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: meinturnierplan
          VERSION: ${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: meinturnierplan-${{ steps.version.outputs.version }}
          path: ${{ github.workspace }}/meinturnierplan.zip
          if-no-files-found: ignore
